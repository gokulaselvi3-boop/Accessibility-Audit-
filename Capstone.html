<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoShop - Modern E-Commerce Capstone Project</title>
    <style>
        /* ========================================
           DESIGN SYSTEM & TOKENS
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Colors */
            --primary-50: #f0f9ff;
            --primary-100: #e0f2fe;
            --primary-200: #bae6fd;
            --primary-300: #7dd3fc;
            --primary-400: #38bdf8;
            --primary-500: #0ea5e9;
            --primary-600: #0284c7;
            --primary-700: #0369a1;
            --primary-800: #075985;
            --primary-900: #0c3d66;

            --neutral-50: #f9fafb;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-300: #d1d5db;
            --neutral-400: #9ca3af;
            --neutral-500: #6b7280;
            --neutral-600: #4b5563;
            --neutral-700: #374151;
            --neutral-800: #1f2937;
            --neutral-900: #111827;

            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;

            /* Typography */
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            --text-4xl: 2.25rem;

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 2.5rem;
            --space-3xl: 3rem;

            /* Transitions */
            --transition-fast: 150ms ease-in-out;
            --transition-normal: 300ms ease-in-out;

            /* Theme */
            --bg-primary: #ffffff;
            --bg-secondary: var(--neutral-50);
            --text-primary: var(--neutral-900);
            --text-secondary: var(--neutral-600);
            --border-color: var(--neutral-200);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.5;
            font-size: var(--text-base);
        }

        /* ========================================
           LAYOUT
           ======================================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-md);
        }

        /* ========================================
           NAVIGATION & HEADER
           ======================================== */
        header {
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            color: white;
            padding: var(--space-lg) 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-lg);
        }

        .logo {
            font-size: var(--text-2xl);
            font-weight: bold;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .header-nav {
            display: flex;
            gap: var(--space-lg);
            align-items: center;
        }

        .nav-btn {
            padding: var(--space-md) var(--space-lg);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transition-fast);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: white;
            color: var(--primary-600);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding-left: var(--space-lg);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        .cart-badge {
            background: var(--error);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-xs);
            font-weight: bold;
        }

        /* ========================================
           HERO SECTION
           ======================================== */
        .hero {
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            color: white;
            padding: var(--space-3xl) var(--space-lg);
            text-align: center;
            margin-top: var(--space-2xl);
            border-radius: 1rem;
        }

        .hero h1 {
            font-size: var(--text-4xl);
            margin-bottom: var(--space-lg);
        }

        .hero p {
            font-size: var(--text-lg);
            margin-bottom: var(--space-xl);
            opacity: 0.95;
        }

        .hero-actions {
            display: flex;
            gap: var(--space-lg);
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ========================================
           BUTTONS
           ======================================== */
        .btn {
            padding: var(--space-md) var(--space-lg);
            border: none;
            border-radius: 0.5rem;
            font-size: var(--text-base);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .btn-primary {
            background: var(--primary-600);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-700);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-600);
            border: 2px solid var(--primary-600);
        }

        .btn-secondary:hover {
            background: var(--primary-50);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-small {
            padding: var(--space-sm) var(--space-md);
            font-size: var(--text-sm);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ========================================
           MODALS & DIALOGS
           ======================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: 1rem;
            padding: var(--space-2xl);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--space-lg);
        }

        .modal-title {
            font-size: var(--text-2xl);
            font-weight: bold;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: var(--text-2xl);
            cursor: pointer;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: var(--space-lg);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-sm);
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-md);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: var(--text-base);
            font-family: var(--font-sans);
            transition: all var(--transition-fast);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px var(--primary-50);
        }

        .form-input::placeholder {
            color: var(--neutral-400);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* ========================================
           MAIN CONTENT
           ======================================== */
        main {
            padding: var(--space-2xl) 0;
            min-height: calc(100vh - 300px);
        }

        /* ========================================
           SECTION TITLE
           ======================================== */
        .section-title {
            font-size: var(--text-3xl);
            font-weight: bold;
            margin-bottom: var(--space-2xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-lg);
        }

        .section-title .btn {
            font-size: var(--text-sm);
        }

        /* ========================================
           PRODUCT GRID
           ======================================== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: var(--space-lg);
            margin-bottom: var(--space-3xl);
        }

        /* ========================================
           PRODUCT CARD
           ======================================== */
        .product-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            transition: all var(--transition-normal);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(-4px);
            border-color: var(--primary-300);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary-100), var(--primary-200));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            overflow: hidden;
        }

        .product-content {
            padding: var(--space-lg);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-size: var(--text-lg);
            font-weight: 600;
            margin-bottom: var(--space-sm);
            color: var(--text-primary);
        }

        .product-description {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
            line-height: 1.5;
            flex-grow: 1;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
        }

        .product-price {
            font-size: var(--text-2xl);
            font-weight: bold;
            color: var(--primary-600);
        }

        .product-stock {
            font-size: var(--text-xs);
            padding: var(--space-xs) var(--space-sm);
            border-radius: 0.25rem;
            font-weight: 500;
        }

        .stock-available {
            background: #dcfce7;
            color: #166534;
        }

        .stock-low {
            background: #fef3c7;
            color: #92400e;
        }

        .stock-out {
            background: #fee2e2;
            color: #991b1b;
        }

        .product-actions {
            display: flex;
            gap: var(--space-sm);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-color);
        }

        .product-actions .btn {
            flex: 1;
            justify-content: center;
        }

        /* ========================================
           CART
           ======================================== */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            margin-bottom: var(--space-2xl);
        }

        .cart-item {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: var(--space-lg);
            display: flex;
            gap: var(--space-lg);
            align-items: center;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-100), var(--primary-200));
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: var(--space-xs);
        }

        .cart-item-price {
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin: 0 auto 0 0;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            cursor: pointer;
            font-weight: bold;
            transition: all var(--transition-fast);
        }

        .quantity-btn:hover {
            background: var(--primary-100);
            color: var(--primary-600);
        }

        .quantity-input {
            width: 50px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            padding: var(--space-xs);
        }

        .cart-summary {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: var(--space-2xl);
            max-width: 400px;
            margin-left: auto;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border-color);
        }

        .summary-row.total {
            border-bottom: none;
            font-size: var(--text-lg);
            font-weight: bold;
            color: var(--primary-600);
        }

        /* ========================================
           ALERTS
           ======================================== */
        .alert {
            padding: var(--space-lg);
            border-radius: 0.75rem;
            margin-bottom: var(--space-lg);
            display: flex;
            align-items: flex-start;
            gap: var(--space-md);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .alert-icon {
            font-size: var(--text-lg);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .alert-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: var(--text-lg);
            margin-left: auto;
            opacity: 0.7;
            transition: opacity var(--transition-fast);
        }

        .alert-close:hover {
            opacity: 1;
        }

        /* ========================================
           EMPTY STATE
           ======================================== */
        .empty-state {
            text-align: center;
            padding: var(--space-3xl) var(--space-lg);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: var(--space-lg);
        }

        .empty-state-title {
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }

        .empty-state-message {
            margin-bottom: var(--space-lg);
        }

        /* ========================================
           FOOTER
           ======================================== */
        footer {
            background: var(--neutral-800);
            color: white;
            padding: var(--space-3xl) var(--space-lg);
            margin-top: var(--space-3xl);
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--space-2xl);
            margin-bottom: var(--space-2xl);
        }

        .footer-section h3 {
            margin-bottom: var(--space-lg);
            font-size: var(--text-lg);
        }

        .footer-section ul {
            list-style: none;
        }

        .footer-section li {
            margin-bottom: var(--space-md);
        }

        .footer-section a {
            color: rgba(255, 255, 255, 0.
